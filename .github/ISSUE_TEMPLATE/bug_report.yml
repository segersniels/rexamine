name: Bug report
description: Report something in rexamine that does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe what you saw. Add the exact error message or a screenshot if you have one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `rexamine` in a repository with ...
        2. Press ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: rexamine version
      description: The output of `rexamine --version`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Your OS, terminal, Rex version, and agent, if they apply.
      placeholder: macOS 15, Rex 1.2, Claude Code

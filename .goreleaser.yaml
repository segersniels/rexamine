version: 2

builds:
  - env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    # Embeds only the tree-sitter grammars that rexdiff uses, which keeps the
    # binary small. Keep in sync with treeSitterLanguages and the Makefile.
    flags:
      - -tags=grammar_subset,grammar_subset_bash,grammar_subset_c,grammar_subset_c_sharp,grammar_subset_cpp,grammar_subset_css,grammar_subset_dart,grammar_subset_dockerfile,grammar_subset_elixir,grammar_subset_go,grammar_subset_gomod,grammar_subset_graphql,grammar_subset_hcl,grammar_subset_java,grammar_subset_javascript,grammar_subset_json,grammar_subset_kotlin,grammar_subset_lua,grammar_subset_make,grammar_subset_proto,grammar_subset_python,grammar_subset_ruby,grammar_subset_rust,grammar_subset_scala,grammar_subset_sql,grammar_subset_swift,grammar_subset_toml,grammar_subset_tsx,grammar_subset_typescript,grammar_subset_yaml,grammar_subset_zig
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    # Names without a version let scripts/install.sh download the latest release by a fixed URL.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - rex/rexdiff.lua
      - skills/rexdiff/SKILL.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc

release:
  github:
    owner: segersniels
    name: rexdiff
